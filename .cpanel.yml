---
deployment:
  tasks:
    - export DEPLOYPATH=/home/contacto/promerc.contactoweb.mx
    - source /home/contacto/nodevenv/promerc.contactoweb.mx/22/bin/activate
    - cd /home/contacto/promerc-src
    - npm install
    - npx prisma generate
    - npx prisma migrate deploy
    - '[ -f .seeded ] || (npx prisma db seed && touch .seeded)'
    - npm run build
    - /bin/cp -R deploy/. $DEPLOYPATH/
